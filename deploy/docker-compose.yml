# ForgeAI local platform: control plane, gateway, three model-server versions (vLLM-compatible
# simulators), and the full observability stack. `make up` from the repo root.
x-forge: &forge
  build: { context: .., dockerfile: Dockerfile }
  image: forgeai:dev
  restart: unless-stopped
  environment: &forge-env
    FORGE_CONTROLPLANE_URL: http://controlplane:8080
    FORGE_PROMETHEUS_URL: http://prometheus:9090
    FORGE_TEMPO_URL: http://tempo:3200
    FORGE_LOKI_URL: http://loki:3100
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_METRICS_EXPORTER: none   # metrics are pull-based (Prometheus); only traces + logs go over OTLP
    FORGE_API_KEYS: ${FORGE_API_KEYS:-dev-admin:platform:admin,dev-acme:acme:operator,dev-free:free-tier:viewer}
    FORGE_SLO_TTFT_P95_S: "0.5"
    FORGE_VERIFY_WINDOW_S: "150"
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    FORGE_AGENT_LLM: ${FORGE_AGENT_LLM:-auto}

x-sim: &sim
  image: forgeai:dev
  restart: unless-stopped
  command: ["forge", "serve", "simulator", "--port", "8000"]

services:
  controlplane:
    <<: *forge
    command: ["forge", "serve", "controlplane", "--port", "8080"]
    ports: ["${FORGE_UI_PORT:-8080}:8080"]
    volumes: [forge-data:/var/lib/forge]
    depends_on: [otel-collector]

  gateway:
    <<: *forge
    command: ["forge", "serve", "gateway", "--port", "8000"]
    ports: ["${FORGE_GATEWAY_PORT:-8000}:8000"]
    environment:
      <<: *forge-env
      FORGE_MAX_INFLIGHT: "32"
      FORGE_MAX_QUEUE: "64"
      FORGE_TTFT_TIMEOUT_S: "10"
    depends_on: [controlplane]

  # v1: baseline fine-tune
  sim-v1:
    <<: *sim
    environment:
      SIM_VERSION: v1
      SIM_ACCURACY: "0.80"
      SIM_TTFT_BASE_MS: "90"
      SIM_TPOT_MS: "8.5"
      SIM_MEAN_OUTPUT_TOKENS: "110"
  # v2: better data, more verbose: higher quality, somewhat slower
  sim-v2:
    <<: *sim
    ports: ["${FORGE_SIM_V2_PORT:-8102}:8000"]
    environment:
      SIM_VERSION: v2
      SIM_ACCURACY: "0.88"
      SIM_TTFT_BASE_MS: "110"
      SIM_TPOT_MS: "9.5"
      SIM_MEAN_OUTPUT_TOKENS: "130"
  # v3: merged a larger adapter + longer context. Looks fine offline at low concurrency, but needs
  # ~30% more GPU memory per replica, so only 4 sequences fit in the KV cache. Under production load it queues.
  sim-v3:
    <<: *sim
    environment:
      SIM_VERSION: v3
      SIM_ACCURACY: "0.89"
      SIM_TTFT_BASE_MS: "130"
      SIM_TPOT_MS: "10"
      SIM_MEAN_OUTPUT_TOKENS: "130"
      SIM_MAX_NUM_SEQS: "4"
      SIM_KV_CAPACITY_TOKENS: "1800"
      SIM_GPU_MEM_BASE_GB: "18.5"

  loadgen:
    <<: *forge
    profiles: ["load"]
    command: ["python", "scripts/loadgen.py", "--url", "http://gateway:8000", "--rps", "${LOAD_RPS:-6}"]
    depends_on: [gateway]

  # ---------------- observability ----------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yml"]
    volumes: [./otel-collector.yml:/etc/otel/config.yml:ro]
    depends_on: [tempo, loki]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yml"]
    volumes: [./tempo.yml:/etc/tempo.yml:ro]
    ports: ["${TEMPO_PORT:-3200}:3200"]

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["${LOKI_PORT:-3100}:3100"]

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: [./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ["${ALERTMANAGER_PORT:-9093}:9093"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/forgeai.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]

volumes:
  forge-data:
