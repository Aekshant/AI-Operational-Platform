global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8000"] }]
  - job_name: controlplane
    static_configs: [{ targets: ["controlplane:8080"] }]
  # Model servers. In Kubernetes the `version` label comes from the pod label via relabeling
  # (see deploy/helm); here it's static.
  - job_name: model-servers
    static_configs:
      - { targets: ["sim-v1:8000"], labels: { model: qwen-farm, version: v1 } }
      - { targets: ["sim-v2:8000"], labels: { model: qwen-farm, version: v2 } }
      - { targets: ["sim-v3:8000"], labels: { model: qwen-farm, version: v3 } }
