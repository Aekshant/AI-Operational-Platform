{{- if .Values.networkPolicy.enabled }}
# Model servers accept traffic only from the gateway (inference), the control plane (evaluation)
# and Prometheus (scrapes). Nothing else in the cluster can reach a GPU directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-model-servers
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: model-server } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchExpressions: [{ key: app.kubernetes.io/component, operator: In, values: [gateway, controlplane] }] }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8000 }]
{{- end }}
