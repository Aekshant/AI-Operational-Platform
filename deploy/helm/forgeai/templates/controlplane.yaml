apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-controlplane
  labels: {{- include "forgeai.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.controlplane.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.controlplane.persistence.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controlplane
  labels: {{- include "forgeai.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  replicas: {{ .Values.controlplane.replicas }}
  strategy: { type: Recreate }   # single SQLite writer
  selector: { matchLabels: { app.kubernetes.io/name: {{ .Release.Name }}-controlplane } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ .Release.Name }}-controlplane, app.kubernetes.io/component: controlplane }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: controlplane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [forge, serve, controlplane, --port, "8080"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            {{- include "forgeai.commonEnv" . | nindent 12 }}
            - { name: FORGE_HOME, value: /var/lib/forge }
            - { name: FORGE_AGENT_LLM, value: {{ .Values.agent.llm | quote }} }
            - { name: FORGE_AGENT_MODEL, value: {{ .Values.agent.model | quote }} }
            {{- if .Values.agent.anthropicSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.agent.anthropicSecret }}, key: ANTHROPIC_API_KEY } }
            {{- end }}
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.controlplane.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: state, mountPath: /var/lib/forge }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-controlplane }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-controlplane
  labels: {{- include "forgeai.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  selector: { app.kubernetes.io/name: {{ .Release.Name }}-controlplane }
  ports: [{ name: http, port: 8080, targetPort: http }]
