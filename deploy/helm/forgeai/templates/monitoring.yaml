{{- if .Values.observability.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-platform
  labels: {{- include "forgeai.labels" . | nindent 4 }}
spec:
  selector: { matchExpressions: [{ key: app.kubernetes.io/component, operator: In, values: [gateway, controlplane] }] }
  endpoints: [{ port: http, path: /metrics, interval: 5s }]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-model-servers
  labels: {{- include "forgeai.labels" . | nindent 4 }}
spec:
  selector: { matchLabels: { app.kubernetes.io/component: model-server } }
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 5s
      # same `model` / `version` labels the simulator stack sets statically
      relabelings:
        - { sourceLabels: [__meta_kubernetes_pod_label_forgeai_dev_model], targetLabel: model }
        - { sourceLabels: [__meta_kubernetes_pod_label_forgeai_dev_version], targetLabel: version }
{{- end }}
{{- if .Values.observability.prometheusRule }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-slo
  labels: {{- include "forgeai.labels" . | nindent 4 }}
spec:
{{ .Files.Get "files/alerts.yml" | indent 2 }}
{{- end }}
