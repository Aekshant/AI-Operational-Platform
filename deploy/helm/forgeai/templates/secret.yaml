{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forgeai.secretName" . }}
  labels: {{- include "forgeai.labels" . | nindent 4 }}
type: Opaque
stringData:
  apiKeys: {{ .Values.auth.apiKeys | quote }}
  gatewayKey: {{ .Values.auth.gatewayKey | quote }}
{{- end }}
